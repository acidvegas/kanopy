# kanopy - Developed by acidvegas in Python (https://github.com/acidvegas)
# .github/workflows/tests.yml

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt "psycopg[binary]"
      - name: Run the suite on ${{ matrix.database }}
        run: python -m unittest -v
        env:
          KANOPY_TEST_DATABASE: ${{ matrix.database == 'postgresql' && 'postgresql://postgres:test@localhost:5432/postgres' || '' }}
